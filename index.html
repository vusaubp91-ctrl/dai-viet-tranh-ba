(()=>{if(!window.THREE){document.getElementById('loading').innerHTML='Không tải được thư viện 3D. Hãy bật mạng và mở bằng Chrome.';return;}const T=THREE;let W=innerWidth,H=innerHeight;const scene=new T.Scene();scene.background=new T.Color('#a8c2bf');scene.fog=new T.FogExp2('#a8c2bf',.008);const camera=new T.PerspectiveCamera(49,W/H,.1,400);camera.position.set(31,29,37);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.32;document.body.insertBefore(renderer.domElement,document.body.firstChild);scene.add(new T.HemisphereLight(0xddefff,0x384632,2.15));const sun=new T.DirectionalLight(0xffdfaa,3.0);sun.position.set(-25,48,23);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-55;sun.shadow.camera.right=55;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;sun.shadow.normalBias=.03;scene.add(sun);
const mat=(c,r=1,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});const stone=mat('#8a8a75'),stone2=mat('#a8a38b'),darkStone=mat('#676e61'),wood=mat('#593929'),wood2=mat('#875331'),gold=mat('#c6a25e',.5,.2),roof=mat('#893b2c'),roofDark=mat('#542c2a'),plaster=mat('#c7b391'),soil=mat('#556e43'),grass=mat('#5b7951'),water=mat('#4a929b',.24,.15),black=mat('#202422'),red=mat('#b52e2b'),blue=mat('#395c66');let seed=36;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}function mesh(g,m,x=0,y=0,z=0,parent=scene){let o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}function box(w,h,d,m,x,y,z,p=scene){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z,p)}function cyl(rt,rb,h,m,x,y,z,n=8,p=scene){return mesh(new T.CylinderGeometry(rt,rb,h,n),m,x,y,z,p)}function ball(r,m,x,y,z,p=scene){return mesh(new T.IcosahedronGeometry(r,1),m,x,y,z,p)}

box(150,2,150,soil,0,-1.4,0);const ground=mesh(new T.PlaneGeometry(140,140,36,36),grass,0,-.35,0);ground.rotation.x=-Math.PI/2;ground.castShadow=false;let a=ground.geometry.attributes.position;for(let i=0;i<a.count;i++){let x=a.getX(i),y=a.getY(i);a.setZ(i,Math.sin(x*.23)*Math.cos(y*.18)*.32+(rand()-.5)*.2)}ground.geometry.computeVertexNormals();const river=box(14,.1,150,water,-38,-.16,0);river.rotation.y=.12;for(let i=0;i<5;i++){let x=-30-i*3;box(1.1,.25,130,stone2,x,-.05,0)}for(let z=-68;z<69;z+=4){box(2,.09,3,stone2,0,-.04,z)}for(let x=-29;x<29;x+=4){box(3,.09,2,stone2,x,-.04,0)}

box(38,1.1,38,darkStone,0,.35,0);box(35,.4,35,stone2,0,1.1,0);function wall(x,z,w,d){box(w,5.7,d,stone,x,4.0,z);box(w+.6,.5,d+.6,darkStone,x,7.05,z);for(let t=-w/2+.8;t<w/2;t+=1.8)box(.95,1,.9,stone2,x+t,7.65,z)}wall(0,-17,34,2.1);wall(0,17,34,2.1);function sideWall(x){box(2.1,5.7,34,stone,x,4,0);box(2.7,.5,34.5,darkStone,x,7.05,0);for(let z=-16;z<17;z+=1.8)box(.9,1,.95,stone2,x,7.65,z)}sideWall(-17);sideWall(17);

box(9,1.2,9,darkStone,0,1.3,18);box(7,5.4,1.2,wood,0,4.3,17.1);for(let x=-2.6;x<3;x+=.72)box(.15,4.7,.25,gold,x,4.3,17.77);box(6.3,1.0,1.7,stone2,0,7.3,17);box(8,.35,3,roofDark,0,8.25,17);function roofTileTexture(){let c=document.createElement('canvas');c.width=256;c.height=256;let q=c.getContext('2d');q.fillStyle='#753529';q.fillRect(0,0,256,256);for(let y=0;y<256;y+=17){for(let x=0;x<256;x+=19){q.strokeStyle='rgba(245,176,115,.42)';q.lineWidth=2;q.beginPath();q.arc(x+(y%34?9:0),y,9,0,Math.PI);q.stroke();q.fillStyle='rgba(15,7,5,.18)';q.fillRect(x,y+9,17,2)}}let t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(3,2);t.colorSpace=T.SRGBColorSpace;return t}const tiles=new T.MeshStandardMaterial({map:roofTileTexture(),color:0xc98a73,roughness:.87,side:T.DoubleSide});function curvedRoof(parent,w,d,y){let shape=new T.Shape();shape.moveTo(-w/2-.65,0);shape.quadraticCurveTo(-w/2,-.55,-w*.3,.6);shape.quadraticCurveTo(0,2.1,w*.3,.6);shape.quadraticCurveTo(w/2,-.55,w/2+.65,0);let geo=new T.ExtrudeGeometry(shape,{depth:d+1.2,bevelEnabled:false,curveSegments:12});geo.computeVertexNormals();let o=mesh(geo,tiles,0,y,-d/2-.6,parent);o.castShadow=true;let ridge=box(.2,.22,d+1.5,gold,0,y+1.65,0,parent);for(let s of [-1,1]){let fin=ball(.36,gold,s*(w/2+.65),y+.2,0,parent);fin.scale.set(1.7,.5,1)}return o}

function palace(x,z,w,d,h,levels=2){let p=new T.Group();p.position.set(x,0,z);scene.add(p);box(w+3,.8,d+3,stone2,0,1.7,0,p);for(let l=0;l<levels;l++){let y=2.2+l*(h+1.8),ww=w-l*2.7,dd=d-l*1.6;box(ww,h,dd,plaster,0,y+h/2,0,p);for(let xx=-ww/2+.8;xx<ww/2;xx+=2.3){box(.28,h+.2,.28,wood2,xx,y+h/2,dd/2+.16,p);box(.28,h+.2,.28,wood2,xx,y+h/2,-dd/2-.16,p)}for(let zz=-dd/2+1;zz<dd/2;zz+=2.3){box(.25,h,.25,wood2,ww/2+.12,y+h/2,zz,p);box(.25,h,.25,wood2,-ww/2-.12,y+h/2,zz,p)}for(let xx=-ww/2+1.6;xx<ww/2-1;xx+=2.5){box(1.1,1.8,.13,black,xx,y+1.7,dd/2+.06,p);box(1.1,.12,.19,gold,xx,y+2.4,dd/2+.16,p)}box(ww+.9,.35,dd+.9,wood2,0,y+h+.1,0,p);curvedRoof(p,ww+2,dd+1,y+h+.55)}return p}palace(0,-7,15,9,4.5,3);palace(-10,5,8,7,3.6,2);palace(10,5,8,7,3.6,2);

const soldiers=[];function soldier(x,z,enemy=false){let g=new T.Group();g.position.set(x,1.45,z);scene.add(g);let armor=enemy?blue:red;box(.58,.86,.36,armor,0,1.1,0,g);box(.67,.22,.45,gold,0,1.55,0,g);cyl(.28,.28,.35,mat('#b48d68'),0,1.79,0,10,g);cyl(.33,.27,.25,darkStone,0,2.03,0,8,g);box(.17,.65,.2,wood, -.17,.37,0,g);box(.17,.65,.2,wood,.17,.37,0,g);box(.19,.7,.18,armor,-.45,1.05,0,g);box(.19,.7,.18,armor,.45,1.05,0,g);cyl(.035,.04,2.5,wood2,.55,1.7,.1,6,g);let spear=cyl(.13,0,.4,gold,.55,3.1,.1,5,g);spear.rotation.z=Math.PI;let shield=cyl(.36,.36,.14,enemy?blue:red,-.52,1.12,.2,12,g);shield.rotation.z=Math.PI/2;ball(.12,gold,-.6,1.13,.2,g);g.userData={startX:x,startZ:z,enemy,phase:rand()*6.28};soldiers.push(g);return g}for(let i=0;i<36;i++){let x=-12+(i%9)*3,z=11+Math.floor(i/9)*1.2;soldier(x,z)}for(let i=0;i<42;i++){let x=-14+(i%7)*1.25,z=36+Math.floor(i/7)*1.5;soldier(x,z,true)}

let az=.7,el=.55,dist=53,target=new T.Vector3(0,4,0),mode='normal',night=false,attacking=false,clock=new T.Clock();function updateCamera(){camera.position.set(target.x+Math.sin(az)*Math.cos(el)*dist,target.y+Math.sin(el)*dist,target.z+Math.cos(az)*Math.cos(el)*dist);camera.lookAt(target)}updateCamera();let fingers=new Map(),lastDist=0;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);fingers.set(e.pointerId,[e.clientX,e.clientY])});renderer.domElement.addEventListener('pointermove',e=>{if(!fingers.has(e.pointerId))return;let old=fingers.get(e.pointerId),dx=e.clientX-old[0],dy=e.clientY-old[1];fingers.set(e.pointerId,[e.clientX,e.clientY]);if(fingers.size===1){az-=dx*.008;el=Math.max(.17,Math.min(1.35,el+dy*.006))}else{let pts=[...fingers.values()],d=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]);if(lastDist)dist=Math.max(15,Math.min(95,dist-(d-lastDist)*.12));lastDist=d}});for(let ev of ['pointerup','pointercancel'])renderer.domElement.addEventListener(ev,e=>{fingers.delete(e.pointerId);lastDist=0});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(15,Math.min(95,dist+e.deltaY*.04))},{passive:true});document.getElementById('reset').onclick=()=>{az=.7;el=.55;dist=53;target.set(0,4,0)};document.getElementById('close').onclick=()=>{dist=25;el=.37;target.set(0,6,-3);document.getElementById('info').textContent='Cổng thành, mái ngói, tháp canh và quân thủ thành'};document.getElementById('day').onclick=e=>{night=!night;scene.background=new T.Color(night?'#1a3040':'#a8c2bf');scene.fog.color.set(night?'#1a3040':'#a8c2bf');sun.intensity=night?.5:3;renderer.toneMappingExposure=night?.85:1.32;e.target.textContent=night?'🌙 Ban đêm':'☀ Ban ngày'};document.getElementById('siege').onclick=e=>{attacking=!attacking;e.target.textContent=attacking?'🛑 Ngừng công thành':'⚔ Công thành';document.getElementById('info').textContent=attacking?'Quân công thành đang tiến tới cổng · Quân phòng thủ sẵn sàng':'Kinh đô Đại Việt · Quân thủ thành: 36';for(let p of smoke)p.visible=attacking};function animate(){requestAnimationFrame(animate);let t=clock.getElapsedTime();for(let i=0;i<flags.length;i++){flags[i].rotation.y=Math.sin(t*2+i)*.12;flags[i].rotation.z=Math.sin(t*2.3+i)*.06}for(let i=0;i<soldiers.length;i++){let s=soldiers[i];if(s.userData.enemy&&attacking){s.position.z=Math.max(22,s.userData.startZ-t%60*.24);s.rotation.y=Math.PI}else if(s.userData.enemy){s.position.z=s.userData.startZ;s.rotation.y=Math.PI}s.position.y=1.45+Math.abs(Math.sin(t*4+s.userData.phase))*.08}for(let i=0;i<siegeUnits.length;i++)siegeUnits[i].position.z=attacking?Math.max(24,41+i*2-t%60*.14):41+i*2;for(let i=0;i<smoke.length;i++){let s=smoke[i];s.position.y=2+(t*.6+i*.37)%5;s.scale.setScalar(.8+(t*.16+i*.07)%1.7)}updateCamera();renderer.render(scene,camera)}window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H)});document.getElementById('loading').remove();animate()})();
